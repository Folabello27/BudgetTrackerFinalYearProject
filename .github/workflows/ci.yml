name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test -- --coverage --coverageReporters=text-summary

    - name: Check coverage threshold
      run: |
        COVERAGE=$(npm test -- --coverage --coverageReporters=text-summary 2>&1 | grep "All files" | awk '{print $3}' | tr -d '%')
        if [ "$COVERAGE" -lt 50 ]; then
          echo "Coverage $COVERAGE% is below threshold of 50%"
          exit 1
        fi
        echo "Coverage $COVERAGE% meets threshold"
